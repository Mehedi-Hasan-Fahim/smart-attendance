<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance - Kiosk</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Kiosk এর জন্য একটু বড় এবং সেন্টার করা ডিজাইন */
        .kiosk-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        video { border: 4px solid #e94560; border-radius: 50%; width: 400px; height: 400px; object-fit: cover; }
        .greeting-text { font-size: 2em; margin-top: 20px; color: #4ade80; font-weight: bold; text-align: center;}
        .admin-link { position: absolute; top: 20px; right: 20px; color: #fff; text-decoration: none; background: #333; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>
    <a href="admin.html" class="admin-link">🔒 Admin Login</a>
    
    <div class="container kiosk-container">
        <h1>🤖 Smart Attendance</h1>
        <div class="video-container" style="position: relative;">
            <video id="video" autoplay muted playsinline></video>
        </div>
        <div id="status" class="status">ক্যামেরা চালু হচ্ছে...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="kiosk.js"></script>
</body>
</html>
