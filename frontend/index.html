<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🤖 Smart Attendance System</h1>
        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>
        <div id="status" class="status">ক্যামেরা চালু হচ্ছে...</div>
        
        <div class="admin-panel">
            <h2>👤 নতুন ইউজার রেজিস্ট্রেশন</h2>
            <input type="text" id="regName" placeholder="নাম">
            <input type="text" id="regId" placeholder="ID">
            <button id="registerBtn">📸 মুখ রেজিস্টার করুন</button>
        </div>

        <div class="attendance-panel">
            <h2>📋 আজকের হাজিরা</h2>
            <table id="attendanceTable">
                <thead>
                    <tr><th>নাম</th><th>ID</th><th>সময়</th><th>ইমোশন</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
